# Render Blueprint (optional): "New > Blueprint" and point it at your GitHub repo.
services:
  - type: web
    name: logo-analyzer-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # paste in the Render dashboard; never commit it
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: CORS_ORIGINS
        sync: false          # your frontend URL, e.g. https://logodoc.pages.dev
      - key: RATE_LIMIT_ANALYZE
        value: 6/minute
      - key: AI_DAILY_LIMIT
        value: "400"
